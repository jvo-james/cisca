<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Cisca Shop</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="commerce.css"></head><body><div data-site-header></div><main><section class="commerce-hero"><div class="wrap"><span class="eyebrow">Secure checkout</span><h1>Almost yours.</h1><p>Use an email address you check. We send your receipt, order updates and tracking link there.</p></div></section><div class="wrap commerce-shell"><form class="checkout-card" data-checkout-form><h2>Contact and delivery</h2><div class="checkout-grid"><div class="field"><label>First name</label><input name="firstName" required></div><div class="field"><label>Last name</label><input name="lastName" required></div><div class="field"><label>Email address</label><input name="email" type="email" required placeholder="Email used for order updates"></div><div class="field"><label>Phone number</label><input name="phone" type="tel" required></div><div class="field full"><label>Delivery address</label><textarea name="address" rows="3" required></textarea></div><div class="field"><label>City / area</label><input name="city" required></div><div class="field"><label>Delivery note</label><input name="note" placeholder="Landmark or useful direction"></div></div><div class="checkout-note">After payment, you can track your order on the website with your order number and email address or phone number.</div><button class="btn btn-rose" type="submit" data-pay>Pay securely</button></form><aside class="summary-card"><h2>Your order</h2><div class="order-items-mini" data-order-mini></div><div class="sumline total"><span>Total</span><strong data-order-total>GH₵0.00</strong></div></aside></div></main><div data-site-footer></div><script type="module" src="shared.js"></script><script type="module" src="checkout.js"></script></body></html>
