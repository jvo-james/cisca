<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track an Order | Cisca Shop</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="commerce.css"></head><body><div data-site-header></div><main class="track-page"><div class="wrap"><div class="track-intro"><span class="eyebrow">Order tracking</span><h1>Find your order.</h1><p>Use the order number from your confirmation and the email address used at checkout. You can switch to your checkout phone number if needed.</p></div><div class="track-panel"><form class="track-form" data-track-form><div class="field"><label>Order number</label><input name="order" required placeholder="CM-2026-0001"></div><div class="field"><label data-contact-label>Email address</label><input name="contact" required placeholder="Email used at checkout"></div><button class="btn btn-rose">Track order</button></form><button class="track-switch" data-toggle-contact>Use phone number instead</button><div class="track-result" data-track-result></div></div></div></main><div data-site-footer></div><script type="module" src="shared.js"></script><script type="module" src="track.js"></script></body></html>
