<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Your Order | Cisca Shop</title><meta name="description" content="Track a Cisca Shop order using your order number and checkout email or phone."><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="commerce.css"></head><body><div data-site-header></div><main><section class="track-shell"><div class="track-art"><img src="images/detail-01.webp" alt="Cisca beauty order"></div><div class="track-copy"><span class="eyebrow" style="color:var(--wine)">Cisca Shop</span><h1>Where is my order?</h1><p style="color:var(--muted);max-width:560px">Enter your order number and the email address used at checkout. If email is not available, switch to the phone number from the order.</p><form class="track-form" data-track-form><div class="field"><label>Order number</label><input name="order" required placeholder="e.g. CISCA-1024"></div><div class="field"><label data-contact-label>Email address</label><input name="contact" type="text" required placeholder="Enter the email address used at checkout"></div><button class="btn" type="submit">Track order</button></form><button class="text-link" style="border:0;border-bottom:1px solid currentColor;background:none;width:max-content;margin-top:14px;padding-left:0" data-toggle-contact>Use phone number instead</button><div class="track-result" data-track-result></div></div></section></main><div data-site-footer></div><script type="module" src="shared.js"></script><script type="module" src="track.js"></script></body></html>
