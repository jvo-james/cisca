<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Registration | Cisca Academy</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="commerce.css"></head><body><div data-site-header></div><main><section class="registration-shell"><aside class="registration-summary" data-class-summary><span class="eyebrow">Selected class</span><h2>Loading class...</h2></aside><section class="registration-form"><span class="eyebrow" style="color:var(--wine)">Cisca Academy</span><h1>Reserve your place.</h1><p style="color:var(--muted);max-width:560px">Add your student details. If registration is open, you will continue to Paystack to secure your place.</p><form data-class-form style="display:grid;gap:15px;margin-top:30px"><div class="field-grid"><div class="field"><label>First name</label><input name="firstName" required></div><div class="field"><label>Last name</label><input name="lastName" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone" type="tel" required></div><div class="field full"><label>Your current level</label><select name="experience"><option>Complete beginner</option><option>I practise on myself</option><option>I have some client experience</option></select></div><div class="field full"><label>What do you want to get from this class?</label><textarea name="goals" rows="5"></textarea></div></div><button class="btn btn-wine" type="submit" data-class-submit>Continue to payment</button></form></section></section></main><div data-site-footer></div><script type="module" src="shared.js"></script><script type="module" src="class-registration.js"></script></body></html>
