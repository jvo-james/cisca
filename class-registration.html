<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Registration | Cisca Academy</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="academy.css"></head><body><div data-site-header></div><main><section class="booking-cover"><div style="min-height:580px"><img src="images/classroom.webp" alt="Cisca Academy class" style="width:100%;height:100%;object-fit:cover"></div><div class="booking-cover-copy"><span class="eyebrow">Cisca Academy</span><h1>Reserve your place.</h1><p>Register with your details, then continue to secure payment when the class is open.</p></div></section><div class="wrap registration-shell"><form class="registration-card" data-class-form><span class="eyebrow">Student details</span><h1>Tell us about you.</h1><p>Your confirmation and class updates will be sent to the email address below.</p><div class="reg-grid"><div class="field"><label>First name</label><input name="firstName" required></div><div class="field"><label>Last name</label><input name="lastName" required></div><div class="field"><label>Email address</label><input name="email" type="email" required></div><div class="field"><label>Phone number</label><input name="phone" type="tel" required></div><div class="field full"><label>Your current level</label><select name="experience"><option>Complete beginner</option><option>I practise on myself</option><option>I have some client experience</option></select></div><div class="field full"><label>What do you want to get from this class?</label><textarea name="goals" rows="5"></textarea></div></div><button class="btn btn-rose" type="submit" data-class-submit>Continue to payment</button></form><aside class="class-summary" data-class-summary><span class="eyebrow">Selected class</span><h2>Loading...</h2></aside></div></main><div data-site-footer></div><script type="module" src="shared.js"></script><script type="module" src="class-registration.js"></script></body></html>
